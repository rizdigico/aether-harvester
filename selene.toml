# Selene configuration for Aether Harvester
# https://kampfkarren.github.io/selene/
# Chains the Roblox std with the local testez std (defines describe/it/expect).
std = "roblox+testez"

[lints]
# Strictness
# global_usage: recovered live client scripts use a _G controller registry
# (MinimapController etc.). Refactor to require-based wiring is backlogged
# (ARCHITECTURE phase); lint relaxed until then.
global_usage = "allow"
if_same_then_else = "warn"
incorrect_standard_library_use = "deny"
shadowing = "allow"
unused_self = "warn"
while_true = "allow"
# UI system intentionally mixes scale+offset for responsive layouts
roblox_manual_fromscale_or_fromoffset = "allow"

[config]
empty_if = { comments_count = true }
