name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Format + Lint + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        run: |
          curl -LsSf -o rokit.zip https://github.com/rojo-rbx/rokit/releases/download/v1.2.0/rokit-1.2.0-linux-x86_64.zip
          unzip -o rokit.zip -d .rokit-bin
          echo "$GITHUB_WORKSPACE/.rokit-bin" >> "$GITHUB_PATH"
          ./.rokit-bin/rokit --version

      - name: Install tools
        run: |
          ./.rokit-bin/rokit trust rojo-rbx/rojo JohnnyMorganz/StyLua Kampfkarren/selene lune-org/lune JohnnyMorganz/luau-lsp
          ./.rokit-bin/rokit install

      - name: StyLua check
        run: stylua --check src tests

      - name: Selene lint
        run: selene src tests

      - name: Rojo build
        run: rojo build --output aether-harvester-ci.rbxlx

      - name: Rojo test build
        run: rojo build test.project.json --output test-place-ci.rbxlx

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-harvester-builds
          path: |
            aether-harvester-ci.rbxlx
            test-place-ci.rbxlx
